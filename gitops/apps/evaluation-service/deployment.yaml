apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
    app.kubernetes.io/part-of: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
        - name: evaluation-service
          image: 423136744371.dkr.ecr.us-east-1.amazonaws.com/togglemaster/evaluation-service:v1.0.0-e7e592e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8004
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          env:
            # --- Observabilidade (Fase 4): OpenTelemetry ---
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: DEPLOYMENT_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: DEPLOYMENT_ENVIRONMENT
            - name: SERVICE_VERSION
              value: "1.1.0"
            # identifica cada pod na telemetria (séries e spans distintos por réplica)
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.namespace.name=togglemaster,k8s.node.name=$(NODE_NAME)"
            # Falha controlada de laboratório (experimento de Self-Healing): com esta
            # variável ativa, a existência de /tmp/togglemaster-force-503 no contêiner
            # faz o /evaluate responder 503. Remover em ambientes reais.
            - name: ENABLE_FAULT_INJECTION
              value: "true"
            - name: PORT
              value: "8004"
            - name: FLAG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: FLAG_SERVICE_URL
            - name: TARGETING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: TARGETING_SERVICE_URL
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: togglemaster-config
                  key: AWS_REGION
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secret
                  key: REDIS_URL
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secret
                  key: SERVICE_API_KEY
            - name: SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secret
                  key: SQS_QUEUE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
