# ==============================================================================
# ArgoCD Applications - Stack de Observabilidade (Fase 4)
#   otel-collector        -> manifestos do agente (DaemonSet) e do gateway
#   prometheus            -> Helm chart prometheus-community/prometheus
#   loki                  -> Helm chart grafana/loki
#   grafana               -> Helm chart grafana-community/grafana
#   grafana-dashboards    -> ConfigMap com o dashboard customizado (kustomize)
#   self-healing          -> automação de resposta ao alerta
#
# Os charts Helm usam os arquivos de valores versionados neste repositório
# (gitops/observability/values), referenciados como $values (multi-source).
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/raferretto/tech-challenge-fase4-togglemaster.git
    targetRevision: HEAD
    path: gitops/observability/otel-collector
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.47.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/gitops/observability/values/prometheus-values.yaml
    - repoURL: https://github.com/raferretto/tech-challenge-fase4-togglemaster.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m

