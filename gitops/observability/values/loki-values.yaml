# ==============================================================================
# Loki (chart grafana/loki) - modo SingleBinary
# Centraliza e indexa os logs de todos os contêineres do cluster. Recebe os logs
# do gateway do OpenTelemetry Collector pelo endpoint OTLP nativo (/otlp).
# Dimensionado para laboratório: disco efêmero e retenção curta.
# ==============================================================================
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false          # sem PVC (o cluster do laboratório não tem o driver EBS CSI)
  # Com a persistência desligada o chart não monta /var/loki, e o contêiner roda com
  # sistema de arquivos somente leitura: o emptyDir abaixo é obrigatório.
  # Os logs se perdem se o pod for recriado.
  extraVolumes:
    - name: storage
      emptyDir: {}
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Modos distribuídos desligados
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Componentes auxiliares dispensáveis no laboratório (economia de pods e memória)
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
