apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector-agent
    app.kubernetes.io/part-of: togglemaster-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector-agent
    spec:
      serviceAccountName: otel-collector-agent
      tolerations:
        - operator: Exists
      containers:
        - name: otel-collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0
          args: ["--config=/conf/config.yaml"]
          securityContext:
            # leitura de /var/log/pods (arquivos pertencentes ao root no nó)
            runAsUser: 0
            runAsGroup: 0
          ports:
            - name: health
              containerPort: 13133
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "300Mi"
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
