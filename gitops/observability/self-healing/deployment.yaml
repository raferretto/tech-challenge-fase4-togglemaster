apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing
  namespace: observability
  labels:
    app: self-healing
    app.kubernetes.io/part-of: togglemaster-observability
spec:
  replicas: 1          # o controle de ocorrências/cooldown fica em memória
  selector:
    matchLabels:
      app: self-healing
  template:
    metadata:
      labels:
        app: self-healing
    spec:
      serviceAccountName: self-healing
      containers:
        - name: self-healing
          image: 423136744371.dkr.ecr.us-east-1.amazonaws.com/togglemaster/self-healing:v1.0.0-e7e592e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Escopo autorizado: uma regra de alerta e um deployment
            - name: ALLOWED_ALERT_NAME
              value: "EvaluationServiceHighErrorRate"
            - name: TARGET_NAMESPACE
              value: "togglemaster"
            - name: TARGET_DEPLOYMENT
              value: "evaluation-service"
            # Intervalo mínimo entre duas intervenções
            - name: COOLDOWN_SECONDS
              value: "300"
            - name: ROLLOUT_TIMEOUT_SECONDS
              value: "240"
            # Segredo compartilhado com o Grafana para a assinatura HMAC do webhook
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-alerting-secrets
                  key: SELF_HEALING_HMAC_SECRET
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: self-healing
  namespace: observability
  labels:
    app: self-healing
spec:
  type: ClusterIP
  selector:
    app: self-healing
  ports:
    - name: http
      port: 8080
      targetPort: 8080
